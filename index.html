<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<title>FormWheel Bomb</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh; display:flex;
  padding:max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:#f7f7f7; color:#111; touch-action:manipulation;
}
/* margin:auto 로 가운데 정렬 → 내용이 길어도 위쪽이 잘리지 않음 */
.app{width:min(460px,100%); margin:auto; text-align:center}
.logo{display:block;color:#111;text-decoration:none;font-size:28px;font-weight:900;margin-bottom:16px}
.card{
  background:#fff; border:1px solid #e5e5e5; position:relative;
  border-radius:28px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.10);
}
h2{margin:4px 0 6px}
.small{font-size:13px;color:#999;margin:0 0 12px}
button{
  width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:800;
  cursor:pointer;background:#f0f0f0;color:#111;margin-top:10px;font-family:inherit;
  transition:transform .08s, opacity .2s;
}
button:active:not(:disabled){transform:scale(.97)}
button.primary{background:#ff3b30;color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px}
.row input{flex:1;min-width:0}
.row button{flex:0 0 96px;margin-top:6px}
input{
  width:100%;padding:15px;border-radius:14px;border:1px solid #ddd;
  background:#fff;color:#111;font-size:16px;outline:none;margin:6px 0;font-family:inherit;
}
input:focus{border-color:#ff3b30}
.info{font-size:13px;color:#777;line-height:1.6;margin-top:16px}
.hidden{display:none!important}

/* 방 코드 */
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.roomcode{
  flex:1;display:flex;align-items:center;justify-content:center;gap:10px;
  background:#f5f5f5;border:1px dashed #ccc;border-radius:14px;padding:10px 12px;
  font-size:13px;color:#777;cursor:pointer;min-width:0;
}
.roomcode b{font-size:24px;letter-spacing:4px;color:#111;font-weight:900}
.leave{width:auto;margin:0;padding:12px 14px;font-size:14px;border-radius:14px}

/* 폭탄 */
.stage{position:relative;height:150px;display:flex;align-items:center;justify-content:center}
.bomb{
  width:105px;height:105px;border-radius:50%;margin-top:12px;
  position:relative;
  background:radial-gradient(circle at 35% 30%,#555,#171717 55%,#050505);
  box-shadow:inset -12px -15px 25px #000,0 0 35px #f002;
  transition:filter .3s, opacity .3s;
}
.bomb:before{content:"";position:absolute;top:-10px;right:21px;width:18px;height:15px;background:#222;border-radius:8px}
.bomb:after{content:"";position:absolute;top:-19px;right:29px;width:5px;height:15px;background:#ff8a00;border-radius:8px;box-shadow:0 0 14px #ff5a00;animation:flame .5s infinite alternate}
.bomb.idle{animation:float 2s ease-in-out infinite}
.bomb.tense{animation:shake .22s infinite;box-shadow:inset -12px -15px 25px #000,0 0 40px #f006}
.bomb.critical{animation:shake .09s infinite;box-shadow:inset -12px -15px 25px #000,0 0 60px #f00a}
.bomb.mine{box-shadow:inset -12px -15px 25px #000,0 0 0 5px #ff3b3033,0 0 40px #f006}
.bomb.boom{animation:boom .6s forwards}
.bomb.off{filter:grayscale(1);opacity:.35;animation:none}
@keyframes flame{from{transform:scaleY(.7)}to{transform:scaleY(1.2)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{
  0%{transform:translate(1px,1px) rotate(0)}25%{transform:translate(-2px,1px) rotate(-3deg)}
  50%{transform:translate(2px,-2px) rotate(3deg)}75%{transform:translate(-1px,2px) rotate(-2deg)}100%{transform:translate(1px,-1px) rotate(2deg)}
}
@keyframes boom{
  0%{transform:scale(1);filter:brightness(1)}
  40%{transform:scale(1.7);filter:brightness(3) saturate(3);background:radial-gradient(circle,#fff,#ffb300 40%,#ff3b30 75%)}
  100%{transform:scale(0);opacity:0}
}
.flash{position:absolute;inset:0;border-radius:28px;background:#ff3b30;opacity:0;pointer-events:none}
.flash.on{animation:flashit .5s}
@keyframes flashit{0%{opacity:.35}100%{opacity:0}}

.status{font-size:18px;font-weight:800;margin:8px 0 14px;min-height:28px;line-height:1.4}
.status.mine{color:#ff3b30}

/* 플레이어 목록 */
.players{text-align:left;margin:16px 0 4px;padding:0;list-style:none}
.players li{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
  background:#f5f5f5;margin:6px 0;font-weight:600;transition:background .25s, transform .25s;
}
.players li .bi{font-size:20px;width:26px;text-align:center;visibility:hidden}
.players li.holder{background:#fff1f0;box-shadow:inset 0 0 0 2px #ff3b30}
.players li.holder .bi{visibility:visible;animation:float 1s ease-in-out infinite}
.players li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players li .tag{font-size:12px;color:#999;font-weight:700}
.players li.dead{opacity:.45;text-decoration:line-through}
.players li.dead .tag{text-decoration:none}
.players li.hit{animation:hit .6s}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.fly{position:fixed;left:0;top:0;font-size:34px;z-index:50;pointer-events:none;will-change:transform}

/* 토스트 */
#toast{
  position:fixed;left:50%;top:max(18px,env(safe-area-inset-top));transform:translate(-50%,-80px);
  background:#111;color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-size:15px;
  z-index:80;transition:transform .3s;max-width:92vw;text-align:center;
}
#toast.show{transform:translate(-50%,0)}

/* 결과 화면 */
.overlay{
  position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;
  padding:16px;animation:fadein .4s 1.1s both;
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.result{
  margin:auto;width:min(400px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:28px;
  padding:26px 22px;text-align:center;animation:pop .45s 1.1s both cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.result .trophy{font-size:64px;line-height:1}
.result h2{font-size:24px;margin:10px 0 4px}
.rank{list-style:none;margin:16px 0 4px;padding:0;text-align:left}
.rank li{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:#f5f5f5;margin:5px 0;font-weight:600}
.rank li:first-child{background:#fff7d6}
.rank li .n{width:28px;text-align:center}
.rank li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wait{font-size:14px;color:#888;margin:14px 0 2px}

@media (max-width:380px){
  .logo{font-size:24px}.card{padding:16px;border-radius:22px}
  .roomcode b{font-size:20px;letter-spacing:3px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <a class="logo" href="https://semicolonxss.github.io/Formwheel/" aria-label="FormWheel 메인으로 이동">💣 FormWheel Bomb</a>

  <div id="lobby" class="card">
    <h2>폭탄 돌리기</h2>
    <p class="small">방을 만들고 친구에게 방 코드를 알려주세요.</p>
    <input id="name" maxlength="16" placeholder="닉네임" autocomplete="off">
    <button id="createBtn" class="primary">방 만들기</button>
    <div class="row">
      <input id="roomInput" maxlength="6" placeholder="방 코드" autocomplete="off" autocapitalize="characters">
      <button id="joinBtn">참가</button>
    </div>
    <div class="info">폭탄 제한시간은 매 판 랜덤으로 <b>10~30초</b>입니다.<br>폭탄을 넘겨도 남은 시간은 그대로 이어집니다.<br>시간이 몇 초 남았는지는 보이지 않아요!</div>
  </div>

  <div id="game" class="card hidden">
    <div class="flash" id="flash"></div>
    <div class="top">
      <div class="roomcode" id="roomCodeBox" title="눌러서 복사">방 코드 <b id="roomCode"></b> <span id="copyHint">복사</span></div>
      <button class="leave" id="leaveBtn">나가기</button>
    </div>

    <div class="stage"><div class="bomb idle" id="bomb"></div></div>
    <div class="status" id="status">게임 준비 중...</div>

    <button id="startBtn" class="primary hidden">게임 시작</button>
    <button id="passBtn" class="primary" disabled>💣 폭탄 넘기기</button>
    <ul id="players" class="players"></ul>
    <div class="info">내 차례일 때만 폭탄을 넘길 수 있어요.<br>시간이 0이 되면 폭탄을 가진 플레이어가 탈락합니다.</div>
  </div>
</div>

<div id="toast"></div>

<div id="resultOverlay" class="overlay hidden">
  <div class="result">
    <div class="trophy">🏆</div>
    <h2 id="resultTitle"></h2>
    <div class="small" id="resultSub"></div>
    <ol class="rank" id="rank"></ol>
    <button id="restartBtn" class="primary hidden">다시 하기</button>
    <div class="wait hidden" id="restartWait">호스트가 다시 시작하기를 기다리는 중...</div>
    <button id="resultLeaveBtn">나가기</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getDatabase, ref, get, set, onValue, runTransaction, remove, onDisconnect, update
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",
  authDomain: "formwheel.firebaseapp.com",
  databaseURL: "https://formwheel-default-rtdb.firebaseio.com",
  projectId: "formwheel",
  storageBucket: "formwheel.firebasestorage.app",
  messagingSenderId: "431583088241",
  appId: "1:431583088241:web:74e0e34ea1e3e1170c55d0",
  measurementId: "G-T372YXDF8D"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const MIN_MS = 10000, MAX_MS = 30000, FLOOR_MS = 5000, STEP_MS = 1000, MAX_PLAYERS = 10;

/* ---------- 저장소 (탭마다 다른 플레이어 ID: 한 기기에서 테스트 가능) ---------- */
const store = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ sessionStorage.removeItem(k); }catch(e){} },
  lget(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  lset(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "p" + Date.now() + Math.random().toString(36).slice(2));
let myId = store.get("bombPlayerId") || uid();
store.set("bombPlayerId", myId);

let roomId = "";
let lastState = null;
let unsubscribe = null;
let lastSeq = null;       // 마지막으로 처리한 이벤트 번호
let exploding = false;
let passing = false;
let offset = 0;           // 서버 시간 보정값 (기기 시계 차이 제거)
let toastTimer = null;

const $ = id => document.getElementById(id);
const now = () => Date.now() + offset;

onValue(ref(db, ".info/serverTimeOffset"), s => { offset = Number(s.val()) || 0; });

/* ---------- 유틸 ---------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

// 10~30초 사이 랜덤 (0.1초 단위)
function randomDuration(){
  return MIN_MS + Math.floor(Math.random() * ((MAX_MS - MIN_MS) / 100 + 1)) * 100;
}

function makeRoomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for(let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

// 입장 순서로 고정 정렬 → 모든 기기에서 같은 순서
function sortedPlayers(obj){
  return Object.values(obj || {}).sort((a,b) =>
    (a.joinedAt || 0) - (b.joinedAt || 0) || String(a.id).localeCompare(String(b.id)));
}

function toast(msg, ms = 2000){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

function getName(){
  const n = $("name").value.trim();
  if(!n){
    alert("닉네임을 입력해주세요.");
    $("name").focus();
    return null;
  }
  store.set("bombName", n);
  store.lset("bombName", n);
  return n;
}

/* ---------- 방 만들기 / 참가 ---------- */
async function createRoom(){
  const name = getName();
  if(!name) return;
  $("createBtn").disabled = true;

  try{
    let code, roomRef, snap, tries = 0;
    do{
      code = makeRoomCode();
      roomRef = ref(db, "bombRooms/" + code);
      snap = await get(roomRef);
      tries++;
    }while(snap.exists() && tries < 8);

    roomId = code;

    await set(roomRef, {
      status: "waiting",
      hostId: myId,
      players: { [myId]: { id: myId, name, alive: true, joinedAt: now() } },
      bombHolder: null,
      startedAt: 0,
      duration: 0,
      round: 0,
      winner: null,
      winnerId: null,
      event: null,
      createdAt: now()
    });

    enterGame();
    listenRoom();
  }catch(e){
    console.error(e);
    alert("방 만들기에 실패했습니다.\nFirebase Realtime Database 규칙과 설정을 확인해주세요.");
  }finally{
    $("createBtn").disabled = false;
  }
}

async function joinRoom(codeArg){
  const name = codeArg ? (store.get("bombName") || "플레이어") : getName();
  if(!name) return;

  const code = (codeArg || $("roomInput").value).trim().toUpperCase();
  if(!code){
    alert("방 코드를 입력해주세요.");
    return;
  }

  $("joinBtn").disabled = true;
  let err = null;

  try{
    const roomRef = ref(db, "bombRooms/" + code);
    const res = await runTransaction(roomRef, cur => {
      err = null;
      if(cur === null) return cur;              // 처음엔 캐시가 비어있을 수 있음 → 서버 값으로 재시도됨
      const ps = cur.players || {};

      if(ps[myId]){ return cur; }               // 이미 참가한 방: 진행 중이어도 다시 들어올 수 있음
      if(cur.status !== "waiting"){ err = "started"; return; }
      if(Object.keys(ps).length >= MAX_PLAYERS){ err = "full"; return; }

      ps[myId] = { id: myId, name, alive: true, joinedAt: now() };
      cur.players = ps;
      return cur;
    });

    if(err === "started"){ alert("이미 시작된 방입니다."); return; }
    if(err === "full"){ alert("최대 10명까지 참가할 수 있습니다."); return; }
    if(!res.snapshot.exists()){
      if(codeArg) store.del("bombRoom");
      else alert("방을 찾을 수 없습니다.");
      return;
    }

    roomId = code;
    enterGame();
    listenRoom();
  }catch(e){
    console.error(e);
    alert("방 참가에 실패했습니다.\nFirebase Realtime Database 규칙과 설정을 확인해주세요.");
  }finally{
    $("joinBtn").disabled = false;
  }
}

function enterGame(){
  store.set("bombRoom", roomId);
  $("lobby").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("roomCode").textContent = roomId;
  window.scrollTo(0, 0);
}

function listenRoom(){
  if(unsubscribe) unsubscribe();
  lastSeq = null;
  const presence=ref(db,"bombRooms/"+roomId+"/presence/"+myId);
  onDisconnect(presence).set(false).then(()=>set(presence,true)).catch(()=>toast("연결 종료 감지 설정 실패"));

  unsubscribe = onValue(ref(db, "bombRooms/" + roomId), snap => {
    if(!snap.exists()){
      store.del("bombRoom");
      alert("방이 삭제되었습니다.");
      location.reload();
      return;
    }
    const data=snap.val();
    if(Object.keys(data.players||{}).some(id=>data.presence?.[id]===false)){
      runTransaction(ref(db,"bombRooms/"+roomId),cur=>{
        if(!cur)return;let changed=false;
        for(const id of Object.keys(cur.players||{}))if(cur.presence?.[id]===false){delete cur.players[id];changed=true;}
        if(!changed)return;
        const rest=sortedPlayers(cur.players);if(!rest.length)return null;
        if(!cur.players[cur.hostId])cur.hostId=rest[0].id;
        const alive=rest.filter(p=>p.alive);
        if(cur.status==="playing"){
          if(alive.length<=1){cur.status="finished";cur.winner=alive[0]?.name||null;cur.winnerId=alive[0]?.id||null;cur.bombHolder=null;cur.endReason="disconnect";}
          else if(!cur.players[cur.bombHolder])cur.bombHolder=alive[0].id;
        }
        return cur;
      },{applyLocally:false}).catch(()=>toast("퇴장 처리에 실패했습니다. 다시 연결해주세요."));return;
    }
    lastState = { ...data, list: sortedPlayers(data.players) };
    render();
  }, error => {
    console.error(error);
    alert("게임 데이터를 불러오지 못했습니다.");
  });
}

/* ---------- 나가기 ---------- */
async function leaveRoom(){
  const code = roomId;
  const s = lastState;
  store.del("bombRoom");
  if(unsubscribe) unsubscribe();

  try{
    if(code && s && s.status === "waiting"){
      // 대기 중에만 방에서 완전히 제거. 진행 중에는 다시 들어올 수 있게 둔다.
      await runTransaction(ref(db, "bombRooms/" + code), cur => {
        if(!cur) return cur;
        const ps = cur.players || {};
        delete ps[myId];
        const rest = sortedPlayers(ps);
        if(rest.length === 0) return null;      // 마지막 사람이 나가면 방 삭제
        if(cur.hostId === myId) cur.hostId = rest[0].id;
        cur.players = ps;
        return cur;
      });
    }
  }catch(e){ console.error(e); }

  location.reload();
}

/* ---------- 게임 시작 ---------- */
async function startGame(){
  if(!roomId) return;
  let err = null;

  try{
    await runTransaction(ref(db, "bombRooms/" + roomId), cur => {
      err = null;
      if(!cur) return cur;
      if(cur.hostId !== myId){ err = "host"; return; }
      if(cur.status !== "waiting"){ return; }

      const alive = sortedPlayers(cur.players).filter(p => p.alive);
      if(alive.length < 2){ err = "min"; return; }

      const first = alive[Math.floor(Math.random() * alive.length)];
      const seq = ((cur.event && cur.event.seq) || 0) + 1;

      cur.status = "playing";
      cur.round = (cur.round || 0) + 1;
      cur.duration = randomDuration();
      cur.startedAt = now();
      cur.bombHolder = first.id;
      cur.winner = null;
      cur.winnerId = null;
      cur.event = { seq, type: "start", to: first.id };
      return cur;
    });

    if(err === "host") alert("호스트만 게임을 시작할 수 있습니다.");
    if(err === "min") alert("최소 2명이 참가해야 게임을 시작할 수 있습니다.");
  }catch(e){
    console.error(e);
    alert("게임 시작에 실패했습니다.\nFirebase Realtime Database 규칙을 확인해주세요.");
  }
}

/* ---------- 폭탄 넘기기 ---------- */
async function passBomb(){
  if(!roomId || passing) return;
  passing = true;
  $("passBtn").disabled = true;

  try{
    await runTransaction(ref(db, "bombRooms/" + roomId), cur => {
      if(!cur) return cur;
      if(cur.status !== "playing") return;
      if(cur.bombHolder !== myId) return;
      // 이미 시간이 다 됐다면 넘길 수 없음 (폭발 처리가 우선)
      if(now() >= cur.startedAt + cur.duration) return;

      const alive = sortedPlayers(cur.players).filter(p => p.alive);
      if(alive.length <= 1) return;

      const idx = alive.findIndex(p => p.id === myId);
      const next = alive[(idx + 1) % alive.length];
      const seq = ((cur.event && cur.event.seq) || 0) + 1;

      // startedAt / duration은 건드리지 않음 → 남은 시간이 그대로 이어진다
      cur.bombHolder = next.id;
      cur.event = { seq, type: "pass", from: myId, to: next.id };
      return cur;
    });
  }catch(e){
    console.error(e);
  }finally{
    passing = false;
    render();
  }
}

/* ---------- 폭발 / 탈락 ---------- */
async function explode(){
  if(!roomId) return;

  try{
    await runTransaction(ref(db, "bombRooms/" + roomId), cur => {
      if(!cur || cur.status !== "playing") return;
      // 서버 기준으로 실제로 시간이 지났을 때만 폭발 (중복 폭발 방지)
      if(now() < cur.startedAt + cur.duration) return;

      const holder = cur.bombHolder;
      const players = cur.players || {};
      if(!players[holder]) return;

      const deadCount = Object.values(players).filter(p => !p.alive).length;
      players[holder].alive = false;
      players[holder].outOrder = deadCount + 1;

      const alive = sortedPlayers(players).filter(p => p.alive);
      const seq = ((cur.event && cur.event.seq) || 0) + 1;
      const victim = { id: holder, name: players[holder].name };

      if(alive.length <= 1){
        cur.status = "finished";
        cur.winner = alive.length === 1 ? alive[0].name : null;
        cur.winnerId = alive.length === 1 ? alive[0].id : null;
        cur.bombHolder = null;
        cur.startedAt = 0;
        cur.event = { seq, type: "explode", from: victim.id, name: victim.name, to: null, final: true };
      }else{
        const next = alive[Math.floor(Math.random() * alive.length)];
        cur.bombHolder = next.id;
        cur.startedAt = now();
        cur.duration = randomDuration();          // 새 폭탄은 다시 10~30초
        cur.event = { seq, type: "explode", from: victim.id, name: victim.name, to: next.id, final: false };
      }

      cur.players = players;
      return cur;
    });
  }catch(e){
    console.error(e);
  }
}

/* ---------- 다시 하기 ---------- */
async function restartGame(){
  if(!roomId) return;
  try{
    await runTransaction(ref(db, "bombRooms/" + roomId), cur => {
      if(!cur) return cur;
      if(cur.hostId !== myId) return;
      if(cur.status !== "finished") return;

      const players = cur.players || {};
      Object.keys(players).forEach(k => {
        players[k].alive = true;
        delete players[k].outOrder;
      });

      const seq = ((cur.event && cur.event.seq) || 0) + 1;
      cur.players = players;
      cur.status = "waiting";
      cur.bombHolder = null;
      cur.startedAt = 0;
      cur.duration = 0;
      cur.winner = null;
      cur.winnerId = null;
      cur.event = { seq, type: "reset" };
      return cur;
    });
  }catch(e){
    console.error(e);
    alert("다시 시작에 실패했습니다.");
  }
}

/* ---------- 화면 그리기 ---------- */
function render(){
  const s = lastState;
  if(!s) return;

  const list = s.list;
  const me = list.find(p => p.id === myId);
  const iAmAlive = !!(me && me.alive);
  const isHost = s.hostId === myId;
  const mine = s.status === "playing" && s.bombHolder === myId && iAmAlive;
  const holder = list.find(p => p.id === s.bombHolder);

  // 플레이어 목록
  $("players").innerHTML = list.map(p => `
    <li data-id="${escapeHtml(p.id)}" class="${p.id === s.bombHolder ? "holder" : ""} ${!p.alive ? "dead" : ""}">
      <span class="bi">💣</span>
      <span class="nm">${escapeHtml(p.name)}</span>
      ${p.id === myId ? '<span class="tag">나</span>' : ""}
      ${p.id === s.hostId ? '<span class="tag">👑</span>' : ""}
      ${!p.alive ? '<span class="tag">💀 탈락</span>' : ""}
    </li>`).join("");

  const bomb = $("bomb");
  const status = $("status");
  status.classList.toggle("mine", mine);
  bomb.classList.toggle("mine", mine);

  $("passBtn").disabled = !mine || passing;
  $("passBtn").classList.toggle("hidden", s.status === "waiting");

  if(s.status === "waiting"){
    bomb.className = "bomb idle";
    $("resultOverlay").classList.add("hidden");
    $("startBtn").classList.toggle("hidden", !isHost);
    $("startBtn").disabled = list.length < 2;

    status.textContent = isHost
      ? (list.length < 2 ? "친구를 기다리는 중..." : "준비 완료! 게임을 시작하세요.")
      : "호스트가 게임을 시작하기를 기다리는 중...";
  }

  if(s.status === "playing"){
    $("startBtn").classList.add("hidden");
    $("resultOverlay").classList.add("hidden");
    if(!bomb.classList.contains("boom")){
      const keep = ["tense","critical"].filter(c => bomb.classList.contains(c));
      bomb.className = "bomb " + (keep.length ? keep.join(" ") : "idle") + (mine ? " mine" : "");
    }

    if(mine) status.textContent = "🔥 내 차례다! 폭탄을 넘겨!";
    else if(!iAmAlive) status.textContent = `💀 관전 중 · ${holder ? holder.name : ""} 님이 폭탄을 가지고 있어요`;
    else status.textContent = holder ? `💣 ${holder.name} 님이 폭탄을 가지고 있어요` : "";
  }

  if(s.status === "finished"){
    $("startBtn").classList.add("hidden");
    bomb.className = "bomb off";
    status.textContent = s.winner ? `🏆 ${s.winner} 승리!` : "게임 종료";
    showResult(s, isHost);
  }

  handleEvent(s);
}

function showResult(s, isHost){
  const dead = s.list.filter(p => !p.alive).sort((a,b) => (b.outOrder||0) - (a.outOrder||0));
  const winner = s.list.find(p => p.id === s.winnerId);
  const ranking = (winner ? [winner] : []).concat(dead);

  const iWon = s.winnerId === myId;
  $("resultTitle").textContent = s.winner ? (iWon ? "🎉 내가 이겼다!" : `${s.winner} 승리!`) : "게임 종료";
  $("resultSub").textContent = iWon ? "끝까지 살아남았어요" : "다음 판에서 복수해 보세요";

  const medals = ["🥇","🥈","🥉"];
  $("rank").innerHTML = ranking.map((p, i) => `
    <li><span class="n">${medals[i] || (i + 1)}</span>
    <span class="nm">${escapeHtml(p.name)}${p.id === myId ? " (나)" : ""}</span></li>`).join("");

  $("restartBtn").classList.toggle("hidden", !isHost);
  $("restartWait").classList.toggle("hidden", isHost);
  $("resultOverlay").classList.remove("hidden");
}

/* ---------- 이벤트(애니메이션) 처리: 이벤트 번호당 한 번만 ---------- */
function handleEvent(s){
  const ev = s.event;
  if(!ev){ if(lastSeq === null) lastSeq = 0; return; }

  // 처음 접속했을 때는 과거 이벤트를 재생하지 않음
  if(lastSeq === null){ lastSeq = ev.seq; return; }
  if(ev.seq === lastSeq) return;
  lastSeq = ev.seq;

  if(ev.type === "pass"){
    flyBomb(ev.from, ev.to);
    if(ev.to === myId){ toast("💣 폭탄이 넘어왔다!"); buzz(80); }
  }

  if(ev.type === "start"){
    toast(ev.to === myId ? "💣 내가 먼저 폭탄을 받았다!" : "게임 시작!");
    if(ev.to === myId) buzz(80);
  }

  if(ev.type === "explode"){
    const bomb = $("bomb");
    bomb.classList.remove("tense","critical","idle");
    bomb.classList.add("boom");
    $("flash").classList.remove("on");
    void $("flash").offsetWidth;
    $("flash").classList.add("on");

    const li = document.querySelector(`#players li[data-id="${CSS.escape(ev.from)}"]`);
    if(li){ li.classList.add("hit"); }

    toast(ev.from === myId ? "💥 내가 터졌다..." : `💥 ${ev.name} 탈락!`, 2200);
    buzz(ev.from === myId ? [200,80,300] : 120);

    setTimeout(() => {
      bomb.classList.remove("boom");
      if(lastState && lastState.status === "finished") bomb.className = "bomb off";
      else {
        bomb.className = "bomb idle";
        if(ev.to) flyBomb(ev.from, ev.to);
      }
    }, 650);
  }

  if(ev.type === "reset"){
    toast("새 게임을 준비해요");
  }
}

// 폭탄이 이전 사람 → 다음 사람 칸으로 날아가는 애니메이션
function flyBomb(fromId, toId){
  const a = document.querySelector(`#players li[data-id="${CSS.escape(fromId || "")}"] .bi`);
  const b = document.querySelector(`#players li[data-id="${CSS.escape(toId || "")}"] .bi`);
  if(!b || !a || !a.animate) return;

  const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  const x1 = ra.left + ra.width / 2 - 17, y1 = ra.top + ra.height / 2 - 17;
  const x2 = rb.left + rb.width / 2 - 17, y2 = rb.top + rb.height / 2 - 17;
  const mx = (x1 + x2) / 2, my = Math.min(y1, y2) - 50;

  const el = document.createElement("div");
  el.className = "fly";
  el.textContent = "💣";
  document.body.appendChild(el);

  // 도착 칸의 💣는 비행이 끝날 때까지 숨김
  b.style.visibility = "hidden";

  const anim = el.animate([
    { transform: `translate(${x1}px,${y1}px) scale(1) rotate(0deg)` },
    { transform: `translate(${mx}px,${my}px) scale(1.6) rotate(180deg)`, offset: .5 },
    { transform: `translate(${x2}px,${y2}px) scale(1) rotate(360deg)` }
  ], { duration: 650, easing: "ease-in-out" });

  const done = () => { el.remove(); b.style.visibility = ""; };
  anim.onfinish = done;
  anim.oncancel = done;
}

/* ---------- 타이머: 하나의 루프만 사용 (중복 실행/증가 버그 방지) ---------- */
setInterval(() => {
  const s = lastState;
  const bomb = $("bomb");
  if(!s || s.status !== "playing" || !s.startedAt) return;

  const left = s.startedAt + s.duration - now();

  if(!bomb.classList.contains("boom")){
    const critical = left < 2500, tense = left < 6000;
    bomb.classList.toggle("critical", critical);
    bomb.classList.toggle("tense", tense && !critical);
    bomb.classList.toggle("idle", !tense);
  }

  if(left <= 0 && !exploding){
    // 폭탄 주인이 먼저 처리하고, 연결이 끊긴 경우에 대비해 다른 사람은 1.5초 뒤 대신 처리
    const wait = s.bombHolder === myId ? 0 : 1500;
    if(left <= -wait){
      exploding = true;
      explode().finally(() => setTimeout(() => { exploding = false; }, 800));
    }
  }
}, 150);

/* ---------- 이벤트 연결 ---------- */
$("createBtn").addEventListener("click", createRoom);
$("joinBtn").addEventListener("click", () => joinRoom());
$("startBtn").addEventListener("click", startGame);
$("passBtn").addEventListener("click", passBomb);
$("restartBtn").addEventListener("click", restartGame);
$("leaveBtn").addEventListener("click", () => { if(confirm("방에서 나갈까요?")) leaveRoom(); });
$("resultLeaveBtn").addEventListener("click", leaveRoom);
$("roomInput").addEventListener("input", e => { e.target.value = e.target.value.toUpperCase(); });
$("roomInput").addEventListener("keydown", e => { if(e.key === "Enter") joinRoom(); });
$("name").addEventListener("keydown", e => { if(e.key === "Enter") createRoom(); });

$("roomCodeBox").addEventListener("click", async () => {
  try{
    await navigator.clipboard.writeText(roomId);
    $("copyHint").textContent = "복사됨 ✓";
  }catch(e){
    $("copyHint").textContent = "직접 복사";
  }
  setTimeout(() => { $("copyHint").textContent = "복사"; }, 1500);
});

// 새로고침해도 방으로 자동 복귀
$("name").value = store.get("bombName") || store.lget("bombName") || "";
const savedRoom = store.get("bombRoom");
if(savedRoom) joinRoom(savedRoom);
</script>
