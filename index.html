<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<title>FormWheel Bomb</title>
<link rel="stylesheet" href="./assets/styles.css">
<link rel="stylesheet" href="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.css">
<script defer src="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.js"></script>
<meta property="og:title" content="Bomb · Formwheel">
<meta property="og:description" content="폭탄을 넘기며 제한 시간 안에 살아남는 멀티 게임.">
<meta property="og:image" content="https://semicolonxss.github.io/Formwheel_Bomb/assets/thumbnail.svg">
<link rel="stylesheet" href="assets/formwheel-brand.css?v=20261008-hub-logo">
<link rel="icon" type="image/svg+xml" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg">
</head>
<body>
<div class="app">
  <a class="logo fw-hub-logo" href="https://semicolonxss.github.io/Formwheel/" aria-label="FormWheel 메인으로 이동"><span class="fw-hub-form">Form</span><span class="fw-hub-icon" aria-hidden="true"></span><span class="fw-hub-wheel">Wheel</span></a>

  <div id="lobby" class="card">
    <h2>폭탄 돌리기</h2>
    <p class="small">방을 만들고 친구에게 방 코드를 알려주세요.</p>
    <input id="name" maxlength="16" placeholder="닉네임" autocomplete="off">
    <button id="createBtn" class="primary">방 만들기</button>
    <div class="row">
      <input id="roomInput" maxlength="6" placeholder="방 코드" autocomplete="off" autocapitalize="characters">
      <button id="joinBtn">참가</button>
    </div>
    <div class="info">폭탄 제한시간은 매 판 랜덤으로 <b>10~30초</b>입니다.<br>폭탄을 넘겨도 남은 시간은 그대로 이어집니다.<br>시간이 몇 초 남았는지는 보이지 않아요!</div>
  </div>

  <div id="game" class="card hidden">
    <div class="flash" id="flash"></div>
    <div class="top">
      <div class="roomcode" id="roomCodeBox" title="눌러서 복사">방 코드 <b id="roomCode"></b> <span id="copyHint">복사</span></div>
      <button class="leave" id="leaveBtn">나가기</button>
    </div>

    <div class="stage"><div class="bomb idle" id="bomb"></div></div>
    <div class="status" id="status">게임 준비 중...</div>

    <button id="startBtn" class="primary hidden">게임 시작</button>
    <button id="passBtn" class="primary" disabled>💣 폭탄 넘기기</button>
    <ul id="players" class="players"></ul>
    <div class="info">내 차례일 때만 폭탄을 넘길 수 있어요.<br>시간이 0이 되면 폭탄을 가진 플레이어가 탈락합니다.</div>
  </div>
</div>

<div id="toast"></div>

<div id="resultOverlay" class="overlay hidden">
  <div class="result">
    <div class="trophy">🏆</div>
    <h2 id="resultTitle"></h2>
    <div class="small" id="resultSub"></div>
    <ol class="rank" id="rank"></ol>
    <button id="restartBtn" class="primary hidden">다시 하기</button>
    <div class="wait hidden" id="restartWait">호스트가 다시 시작하기를 기다리는 중...</div>
    <button id="resultLeaveBtn">나가기</button>
  </div>
</div>

<script type="module" src="./assets/app.js"></script>
<script type="module" src="https://semicolonxss.github.io/Formwheel/assets/live-presence.js?v=20261011-all"></script>
</body>
</html>
