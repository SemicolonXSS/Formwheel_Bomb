<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FormWheel Bomb</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f7f7f7; color:#111;
}
.app{width:min(460px,94vw); text-align:center}
.logo{display:block;color:#111;text-decoration:none;font-size:30px;font-weight:900;margin-bottom:18px}
.card{
  background:#fff; border:1px solid #e5e5e5;
  border-radius:28px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.10);
}
.bomb{
  width:190px;height:190px;border-radius:50%;margin:8px auto 22px;
  display:flex;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(circle at 35% 30%,#555,#171717 55%,#050505);
  box-shadow:inset -12px -15px 25px #000,0 0 35px #f002;
}
.bomb:before{content:"";position:absolute;top:-16px;right:38px;width:30px;height:25px;background:#222;border-radius:8px}
.bomb:after{content:"";position:absolute;top:-32px;right:51px;width:8px;height:25px;background:#ff8a00;border-radius:8px;box-shadow:0 0 14px #ff5a00}
.timer{display:none}
.status{font-size:18px;font-weight:700;margin:10px 0 24px}
button{
  width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:800;
  cursor:pointer;background:#fff;color:#111;margin-top:10px;
}
button.primary{background:#ff3b30;color:white}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px}
.row button{flex:1}
input{
  width:100%;padding:15px;border-radius:14px;border:1px solid #ddd;
  background:#fff;color:#111;font-size:16px;outline:none;margin:6px 0;
}
.info{font-size:13px;color:#777;line-height:1.6;margin-top:18px}
.hidden{display:none}
.players{text-align:left;margin:15px 0;padding:0;list-style:none}
.players li{padding:10px 12px;border-radius:12px;background:#f5f5f5;margin:5px 0}
.small{font-size:13px;color:#aaa}
</style>
</head>
<body>
<div class="app">
  <a class="logo" href="https://semicolonxss.github.io/Formwheel/" aria-label="FormWheel 메인으로 이동">💣 FormWheel Bomb</a>

  <div id="lobby" class="card">
    <h2>폭탄 돌리기</h2>
    <p class="small">방을 만들고 친구에게 방 코드를 알려주세요.</p>
    <input id="name" maxlength="16" placeholder="닉네임">
    <button class="primary" onclick="createRoom()">방 만들기</button>
    <div class="row">
      <input id="roomInput" maxlength="8" placeholder="방 코드">
      <button onclick="joinRoom()">참가</button>
    </div>
    <div class="info">폭탄 제한시간은 매 판 랜덤으로<br><b>30~40초</b> 또는 <b>1분~1분 10초</b>가 됩니다.</div>
  </div>

  <div id="game" class="card hidden">
    <div class="room-code">방 코드: <b id="roomCode"></b></div>
    <div class="bomb"></div>
    <div class="status" id="status">게임 준비 중...</div>
    <button id="startBtn" class="primary hidden" onclick="startGame()">게임 시작</button>
    <button id="passBtn" class="primary" onclick="passBomb()">💣 폭탄 넘기기</button>
    <ul id="players" class="players"></ul>
    <div class="info">내 차례일 때만 폭탄을 넘길 수 있어요.<br>시간이 0이 되면 폭탄을 가진 플레이어가 탈락합니다.</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getDatabase, ref, get, set, update, onValue, runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",
  authDomain: "formwheel.firebaseapp.com",
  databaseURL: "https://formwheel-default-rtdb.firebaseio.com",
  projectId: "formwheel",
  storageBucket: "formwheel.firebasestorage.app",
  messagingSenderId: "431583088241",
  appId: "1:431583088241:web:74e0e34ea1e3e1170c55d0",
  measurementId: "G-T372YXDF8D"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomId = "";
let myId = localStorage.getItem("bombPlayerId") || crypto.randomUUID();
localStorage.setItem("bombPlayerId", myId);
let lastState = null;
let timerInterval = null;
let unsubscribe = null;

const $ = id => document.getElementById(id);

function getName(){
  const n = $("name").value.trim();
  if(!n){
    alert("닉네임을 입력해주세요.");
    return null;
  }
  return n;
}

function randomDuration(){
  return Math.random() < 0.5
    ? 30000 + Math.floor(Math.random() * 10001)
    : 60000 + Math.floor(Math.random() * 10001);
}

function makeRoomCode(){
  return Math.random().toString(36).slice(2,8).toUpperCase();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

window.createRoom = async () => {
  const name = getName();
  if(!name) return;

  try{
    $("status") && ($("status").textContent = "방 만드는 중...");
    let code = makeRoomCode();
    let roomRef = ref(db, "bombRooms/" + code);
    let snap = await get(roomRef);

    while(snap.exists()){
      code = makeRoomCode();
      roomRef = ref(db, "bombRooms/" + code);
      snap = await get(roomRef);
    }

    roomId = code;

    const player = {
      id: myId,
      name: name,
      alive: true
    };

    await set(roomRef, {
      status: "waiting",
      players: {
        [myId]: player
      },
      bombHolder: myId,
      startedAt: 0,
      duration: randomDuration(),
      winner: null,
      createdAt: Date.now()
    });

    enterGame();
    listenRoom();
  }catch(e){
    console.error(e);
    alert("방 만들기에 실패했습니다.\nFirebase Realtime Database 규칙과 설정을 확인해주세요.");
  }
};

window.joinRoom = async () => {
  const name = getName();
  if(!name) return;

  const code = $("roomInput").value.trim().toUpperCase();
  if(!code){
    alert("방 코드를 입력해주세요.");
    return;
  }

  try{
    const roomRef = ref(db, "bombRooms/" + code);
    const snap = await get(roomRef);

    if(!snap.exists()){
      alert("방을 찾을 수 없습니다.");
      return;
    }

    const data = snap.val();

    if(data.status !== "waiting"){
      alert("이미 시작된 방입니다.");
      return;
    }

    const players = data.players || {};
    if(Object.keys(players).length >= 10){
      alert("최대 10명까지 참가할 수 있습니다.");
      return;
    }

    if(players[myId]){
      alert("이미 참가한 방입니다.");
      roomId = code;
      enterGame();
      listenRoom();
      return;
    }

    await update(roomRef, {
      ["players/" + myId]: {
        id: myId,
        name: name,
        alive: true
      }
    });

    roomId = code;
    enterGame();
    listenRoom();

  }catch(e){
    console.error(e);
    alert("방 참가에 실패했습니다.\nFirebase Realtime Database 규칙과 설정을 확인해주세요.");
  }
};

function enterGame(){
  $("lobby").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("roomCode").textContent = roomId;
}

function listenRoom(){
  if(unsubscribe) unsubscribe();

  const roomRef = ref(db, "bombRooms/" + roomId);

  unsubscribe = onValue(roomRef, snap => {
    if(!snap.exists()){
      alert("방이 삭제되었습니다.");
      location.reload();
      return;
    }

    lastState = normalizeState(snap.val());
    render();
  }, error => {
    console.error(error);
    alert("게임 데이터를 불러오지 못했습니다.");
  });
}

function normalizeState(data){
  const playersObject = data.players || {};
  return {
    ...data,
    players: Object.values(playersObject)
  };
}

function render(){
  const s = lastState;
  if(!s) return;

  $("players").innerHTML = s.players.map(p =>
    `<li>${p.id === s.bombHolder ? "💣 " : ""}${escapeHtml(p.name)}
     ${p.id === myId ? "<b>(나)</b>" : ""}
     ${!p.alive ? " 💀" : ""}</li>`
  ).join("");

  const mine = s.bombHolder === myId && s.status === "playing";
  $("passBtn").disabled = !mine;

  if(s.status === "waiting"){
    $("timer").textContent = "";

    // The first player is the host.
    const hostId = s.players.length ? s.players[0].id : null;
    const isHost = hostId === myId;

    $("startBtn").classList.toggle("hidden", !isHost);
    $("startBtn").disabled = s.players.length < 2;

    $("status").textContent = s.players.length < 2
      ? (isHost ? "친구를 기다리는 중..." : "호스트가 게임을 시작하기를 기다리는 중...")
      : (isHost ? "준비 완료! 게임을 시작하세요." : "호스트가 게임을 시작하기를 기다리는 중...");

    $("passBtn").disabled = true;
    return;
  }

  if(s.status === "playing"){
    $("startBtn").classList.add("hidden");
    $("status").textContent = mine
      ? "🔥 내 차례! 폭탄을 넘겨!"
      : "상대방이 폭탄을 가지고 있어요.";
    startTimer();
    return;
  }

  if(s.status === "finished"){
    $("startBtn").classList.add("hidden");
    $("status").textContent = s.winner
      ? `🏆 ${escapeHtml(s.winner)} 승리!`
      : "게임 종료";
    $("passBtn").disabled = true;
    $("timer").textContent = "";
  }
}

function startTimer(){
  clearInterval(timerInterval);

  const updateTimer = async () => {
    if(!lastState || lastState.status !== "playing") return;

    const left = Math.max(
      0,
      Number(lastState.startedAt) + Number(lastState.duration) - Date.now()
    );

    $("timer").textContent = "";

    if(left <= 0){
      clearInterval(timerInterval);
      await explode();
    }
  };

  updateTimer();
  timerInterval = setInterval(updateTimer, 200);
}

window.startGame = async () => {
  if(!roomId || !lastState) return;

  try{
    const roomRef = ref(db, "bombRooms/" + roomId);

    await runTransaction(roomRef, current => {
      if(!current || current.status !== "waiting") return current;

      const players = Object.values(current.players || {})
        .filter(p => p.alive);

      if(players.length < 2) return current;

      // The first player in the room is the host.
      if(players[0].id !== myId) return current;

      current.status = "playing";
      current.startedAt = Date.now();
      current.bombHolder = players[0].id;

      return current;
    });
  }catch(e){
    console.error(e);
    alert("게임 시작에 실패했습니다.");
  }
};

window.passBomb = async () => {
  if(!roomId) return;

  try{
    const roomRef = ref(db, "bombRooms/" + roomId);

    await runTransaction(roomRef, current => {
      if(!current) return current;

      if(current.status !== "playing") return;
      if(current.bombHolder !== myId) return;

      const players = Object.values(current.players || {})
        .filter(p => p.alive);

      if(players.length <= 1) return current;

      const index = players.findIndex(p => p.id === myId);
      const next = players[(index + 1) % players.length];

      current.bombHolder = next.id;
      current.startedAt = Date.now();

      return current;
    });
  }catch(e){
    console.error(e);
  }
};

async function explode(){
  if(!roomId || !lastState || lastState.status !== "playing") return;

  try{
    const roomRef = ref(db, "bombRooms/" + roomId);

    await runTransaction(roomRef, current => {
      if(!current || current.status !== "playing") return current;

      const holder = current.bombHolder;
      const players = current.players || {};

      if(!players[holder]) return current;

      players[holder].alive = false;

      const alive = Object.values(players).filter(p => p.alive);

      if(alive.length <= 1){
        current.status = "finished";
        current.winner = alive.length === 1 ? alive[0].name : null;
        current.bombHolder = null;
        current.startedAt = 0;
      }else{
        const next = alive[Math.floor(Math.random() * alive.length)];
        current.status = "playing";
        current.bombHolder = next.id;
        current.startedAt = Date.now();
      }

      current.players = players;
      return current;
    });
  }catch(e){
    console.error(e);
  }
}

</script>
</body>
</html>
